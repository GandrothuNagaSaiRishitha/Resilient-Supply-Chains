[project]
name = "supplymind-backend"
version = "1.0.0"
description = "SUPPLYMIND - organizational-memory-powered supply chain intelligence"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic-settings>=2.4",
  "PyJWT>=2.8",
  "argon2-cffi>=23.1",
  "groq>=0.30",
  "httpx>=0.27",
  "apscheduler>=3.10,<4",
  "hindsight-client>=0.4",
  "python-multipart>=0.0.9",
  "email-validator>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires a live Hindsight server",
  "slow: long-running real-memory experiment",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["alembic*"]